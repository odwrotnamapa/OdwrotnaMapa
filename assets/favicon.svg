<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 120 120">
  <!-- Główne tło rozciągnięte maksymalnie -->
  <circle cx="64" cy="64" r="60" fill="#111315"/>
  <!-- Pogrubiony biały pierścień -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#ffffff" stroke-width="6"/>

  <!-- Powiększona górna igła -->
  <path d="M64 12 L86 64 L64 56 L42 64 Z"
        fill="#ffffff"
        stroke="#111315"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Powiększona dolna igła -->
  <path d="M64 116 L42 64 L64 72 L86 64 Z"
        fill="#e3342f"
        stroke="#111315"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Większy centralny punkt, żeby był widoczny jako kropka -->
  <circle cx="64" cy="64" r="16" fill="#ffffff" stroke="#111315" stroke-width="4"/>
</svg>

